<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CozyNotes — Aplikasi jurnal harian dan pencatatan interaktif dengan arsitektur Web Components modular, integrasi Dicoding RESTful API, Webpack bundler, pelacak mood harian, to-do checklist, dan pemutar audio suasana santai berpalet pastel hangat." />
    <title>CozyNotes — Jurnal & Catatan Harian</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect x='4' y='4' width='56' height='56' rx='18' fill='%23FED7AA'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle'%3E🌻%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Puffy Sky Clouds -->
    <div class="sky-clouds" aria-hidden="true">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>

    <!-- Cheerful Bunting Flags Banner -->
    <div class="bunting-banner" aria-hidden="true">
      <div class="bunting-flag flag-pink"></div>
      <div class="bunting-flag flag-yellow"></div>
      <div class="bunting-flag flag-green"></div>
      <div class="bunting-flag flag-blue"></div>
      <div class="bunting-flag flag-peach"></div>
      <div class="bunting-flag flag-purple"></div>
      <div class="bunting-flag flag-pink"></div>
      <div class="bunting-flag flag-yellow"></div>
      <div class="bunting-flag flag-green"></div>
      <div class="bunting-flag flag-blue"></div>
      <div class="bunting-flag flag-peach"></div>
      <div class="bunting-flag flag-purple"></div>
      <div class="bunting-flag flag-pink"></div>
      <div class="bunting-flag flag-yellow"></div>
      <div class="bunting-flag flag-green"></div>
    </div>

    <app-bar></app-bar>

    <div class="app-layout-wrapper">
      <main class="app-main-content">
        <!-- Daily Mood & Greeting -->
        <mood-greeting></mood-greeting>
        <!-- Memo Note Form -->
        <form-note></form-note>
        <!-- Notes Section -->
        <notes-section></notes-section>
      </main>

      <aside class="app-sidebar">
        <!-- Daily Checklist -->
        <picnic-checklist></picnic-checklist>
        <!-- Ambient Soundboard -->
        <cozy-soundboard></cozy-soundboard>
        <!-- Daily Cozy Inspiration -->
        <div class="cozy-quote-card">
          <div class="quote-header">
            <span class="quote-icon">☕🌻</span>
            <span class="quote-badge">Pesan Hari Ini</span>
          </div>
          <p class="quote-text">"Hari yang indah dimulai dari pikiran yang tenang dan langkah-langkah kecil penuh kebaikan."</p>
          <span class="quote-footer">Semangat berkarya dan jaga senyummu! ✨</span>
        </div>
      </aside>
    </div>

    <edit-modal></edit-modal>
    <div id="particleContainer" class="particle-container" aria-hidden="true"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  </body>
</html>
